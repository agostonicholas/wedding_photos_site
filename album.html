<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wedding Photo Drop · Album</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="album-body">
    <main class="album-wrapper">
      <div class="album-header">
        <div>
          <p class="eyebrow">Wedding Photo Drop</p>
          <h1>Nick and Sara's Wedding Album</h1>
          <p class="tagline">Browse everything guests have shared. New uploads appear automatically within a few seconds.</p>
        </div>
        <a class="primary-btn" href="index.html">Back to uploader</a>
      </div>

      <div class="gallery-filters" role="group" aria-label="Album filters">
        <button class="filter-btn active" data-filter="all" aria-pressed="true">All Photos</button>
        <button class="filter-btn" data-filter="mine" aria-pressed="false">Photos From This Browser</button>
      </div>

      <div id="gallery-status" class="gallery-status">Loading recent photos…</div>
      <section id="gallery-grid" class="gallery-grid" aria-live="polite"></section>
      <button id="load-more" class="primary-btn" type="button" hidden>Load more photos</button>
    </main>

    <script src="site-config.js" defer></script>
    <script src="client.js" defer></script>
    <script src="album.js" defer></script>
  </body>
</html>
